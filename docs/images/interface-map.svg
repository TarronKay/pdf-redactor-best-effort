<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="930" viewBox="0 0 1280 930" role="img" aria-labelledby="title desc">
  <title id="title">PDF Redactor 0.9.2 interface map</title>
  <desc id="desc">Source-based schematic, not a screenshot. Numbered controls match the user guide table. All sample content is fictional.</desc>
  <defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172536;font-size:17px}.small{font-size:15px}.heading{font-size:27px;font-weight:bold}.button{fill:#fff;stroke:#9ba7b3}.badge{fill:#123f72}.n{fill:#fff;text-anchor:middle;font-size:14px;font-weight:bold}.note{fill:#42576d}</style></defs>
  <rect width="1280" height="930" rx="14" fill="#eef2f6"/>
  <text x="28" y="38" class="heading">PDF Redactor Best Effort 0.9.2 — interface map</text>
  <text x="28" y="67" class="note">SCHEMATIC • not a screenshot • fictional sample • numbers match the control reference</text>
  <rect x="24" y="86" width="1232" height="817" fill="#f8f9fa" stroke="#bcc7d2"/>
  <text x="49" y="118">Help → About</text><circle cx="195" cy="111" r="14" class="badge"/><text x="195" y="116" class="n">17</text>
  <text x="49" y="158" class="heading">PDF Redactor - Best effort</text>
  <text x="49" y="188" class="small">Local processing. Page checks are optional; inspect the exported content yourself.</text>
  <text x="49" y="220" class="small">Enter names or IDs. Suggestions refresh automatically. Check for missed identifiers.</text>
  <rect x="49" y="239" width="1182" height="45" rx="4" fill="#fff0d2"/>
  <circle cx="69" cy="261" r="14" class="badge"/><text x="69" y="266" class="n">15</text>
  <text x="94" y="267" class="small">MODE WARNING: Check text and pixels.</text>
  <rect x="1048" y="247" width="172" height="29" rx="3" class="button"/><text x="1060" y="267" class="small">Advanced options</text>
  <circle cx="1029" cy="261" r="14" class="badge"/><text x="1029" y="266" class="n">12</text>
  <g class="small">
    <rect x="49" y="308" width="112" height="36" rx="3" class="button"/><text x="66" y="332">Select PDF</text>
    <rect x="171" y="308" width="181" height="36" rx="3" class="button"/><text x="184" y="332">Refresh suggestions</text>
    <rect x="362" y="308" width="103" height="36" rx="3" class="button"/><text x="382" y="332">Previous</text>
    <rect x="475" y="308" width="81" height="36" rx="3" class="button"/><text x="498" y="332">Next</text>
    <rect x="566" y="308" width="177" height="36" rx="3" class="button"/><text x="580" y="332">Clear page regions</text>
    <rect x="753" y="308" width="229" height="36" rx="3" class="button"/><text x="775" y="332">Mark checked (optional)</text>
    <rect x="992" y="308" width="239" height="36" rx="3" class="button"/><text x="1018" y="332">Export redacted copy</text>
  </g>
  <g><circle cx="105" cy="300" r="14" class="badge"/><text x="105" y="305" class="n">1</text><circle cx="261" cy="300" r="14" class="badge"/><text x="261" y="305" class="n">2</text><circle cx="414" cy="300" r="14" class="badge"/><text x="414" y="305" class="n">3</text><circle cx="515" cy="300" r="14" class="badge"/><text x="515" y="305" class="n">4</text><circle cx="655" cy="300" r="14" class="badge"/><text x="655" y="305" class="n">5</text><circle cx="867" cy="300" r="14" class="badge"/><text x="867" y="305" class="n">6</text><circle cx="1112" cy="300" r="14" class="badge"/><text x="1112" y="305" class="n">7</text></g>
  <rect x="49" y="358" width="1182" height="43" fill="#e7edf4"/>
  <circle cx="69" cy="380" r="14" class="badge"/><text x="69" y="385" class="n">13</text><text x="94" y="386">◉ Selectable text (best effort)</text>
  <circle cx="469" cy="380" r="14" class="badge"/><text x="469" y="385" class="n">14</text><text x="494" y="386">○ Image-only (no text layer)</text>
  <text x="976" y="386" class="small note">Advanced panel expanded</text>
  <circle cx="69" cy="430" r="14" class="badge"/><text x="69" y="435" class="n">8</text><text x="94" y="436" class="small">☑ Remove institution</text>
  <circle cx="294" cy="430" r="14" class="badge"/><text x="294" y="435" class="n">9</text><text x="319" y="436" class="small">☑ Remove test dates</text>
  <circle cx="518" cy="430" r="14" class="badge"/><text x="518" y="435" class="n">10</text><text x="543" y="436" class="small">☑ Show redacted page (black boxes)</text>
  <circle cx="883" cy="430" r="14" class="badge"/><text x="883" y="435" class="n">11</text><text x="908" y="436" class="small">Known identifiers (one per line):</text>
  <rect x="908" y="448" width="306" height="55" fill="#fff" stroke="#a8b4c0"/><text x="919" y="469" class="small">Alex Example</text><text x="919" y="490" class="small">DEMO-0042</text>
  <text x="49" y="530" class="small">STATUS: Redacted preview 1/2 | 2 redactions | 0 pages checked (optional). Inspect for missed identifiers.</text>
  <rect x="49" y="550" width="1182" height="293" fill="#dce3ea"/>
  <rect x="324" y="560" width="618" height="272" fill="#fff" stroke="#b2bdc9"/>
  <text x="353" y="590" font-weight="bold">FICTIONAL TRAINING REPORT</text>
  <text x="353" y="622" class="small">Name:</text><rect x="420" y="603" width="196" height="26" fill="#000" stroke="#e64b35" stroke-width="2"/>
  <text x="353" y="656" class="small">Student ID:</text><rect x="440" y="637" width="159" height="26" fill="#000" stroke="#e64b35" stroke-width="2"/>
  <text x="353" y="699" class="small">Example educational result: 75</text>
  <text x="353" y="735" class="small note">Inspect all pages, images, headers and footers.</text>
  <text x="353" y="771" class="small note">Never use a real document in public screenshots.</text>
  <rect x="1211" y="555" width="15" height="283" rx="4" fill="#bdc7d1"/><rect x="1213" y="559" width="11" height="86" rx="4" fill="#8797a7"/>
  <circle cx="84" cy="584" r="14" class="badge"/><text x="84" y="589" class="n">16</text>
  <text x="109" y="590" class="small">Page canvas</text><text x="70" y="628" class="small">Left-drag: add box</text><text x="70" y="657" class="small">Right-click: remove</text><text x="70" y="686" class="small">Scrollbar: see below</text>
  <text x="49" y="876" class="small">Boxes follow displayed orientation. Checking pages is optional. Inspect the saved output before sharing.</text>
</svg>
